packages:
  - apps/*
  - benchmarks
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
overrides:
  vite: "catalog:"
packageExtensions:
  "dependency-cruiser@18.2.0":
    dependencies:
      typescript: 6.0.3
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
